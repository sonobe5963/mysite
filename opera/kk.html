        <h1>主要なる祈</h1>

        <h2>主祷文</h2>

        <p>天に在まし我等の父よ、<br>願わくは、御名の尊まれんことを、御国の来たらんことを、<br>御旨の天に行わるる如く、地にも行われんことを。</p>

        <p>▲我等の日用の糧を、今日我等に与え給え。<br>我等が人に赦す如く、我等の罪を赦し給え。<br>我等を試みに引き給わざれ、我等を悪より救い給え。<br>アーメン</p>

        <h2>天使祝詞</h2>

        <p>めでたし聖寵</p>
